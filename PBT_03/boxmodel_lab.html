<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <h1>Phần 1 — Content-box vs Border-box</h1>

    <div class="wrapper">
        <div class="box content-box">
            <h2>Content Box</h2>
            <p>box-sizing: content-box</p>
        </div>

        <div class="box border-box">
            <h2>Border Box</h2>
            <p>box-sizing: border-box</p>
        </div>
    </div>

    <hr>

    <h1>Phần 2 — Layout 3 cột</h1>

    <h2>Trường hợp KHÔNG dùng border-box</h2>

    <div class="container normal-layout">
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
        <div class="ads">Ads</div>
    </div>

    <h2>Trường hợp CÓ dùng border-box</h2>

    <div class="container fixed-layout">
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
        <div class="ads">Ads</div>
    </div>

</body>
</html>
