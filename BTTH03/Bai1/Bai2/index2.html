<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Công Việc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>QUẢN LÝ CÔNG VIỆC</h1>

<button id="btnAddTask">
    + Thêm Công Việc
</button>

<div class="summary">
    <p>Tổng: <span id="totalTask">0</span></p>
    <p>Hoàn thành: <span id="doneTask">0</span></p>
    <p>Chưa hoàn thành: <span id="todoTask">0</span></p>
</div>

<div id="message"></div>

<div id="taskList"></div>

<div id="modal" class="modal">

    <div class="modal-content">

        <h2 id="formTitle">
            Thêm Công Việc
        </h2>

        <form id="taskForm">

            <input
                type="text"
                id="title"
                placeholder="Tiêu đề"
                required
            >

            <textarea
                id="description"
                placeholder="Mô tả"
            ></textarea>

            <input
                type="date"
                id="deadline"
                required
            >

            <select id="priority">

                <option value="Thấp">
                    Thấp
                </option>

                <option value="Trung Bình">
                    Trung Bình
                </option>

                <option value="Cao">
                    Cao
                </option>

            </select>

            <button type="submit">
                Lưu
            </button>

            <button
                type="button"
                id="btnClose"
            >
                Hủy
            </button>

        </form>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
