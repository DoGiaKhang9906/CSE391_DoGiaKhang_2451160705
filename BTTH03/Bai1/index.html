<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>QUẢN LÝ SINH VIÊN</h1>

    <div class="top-bar">
        <button id="btnAdd">+ Thêm Sinh Viên</button>
    </div>

    <div class="statistics">
        <p>Tổng sinh viên: <span id="totalStudents">0</span></p>
        <p>Điểm TB lớp: <span id="avgScore">0</span></p>
    </div>

    <div id="message"></div>

    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ Tên</th>
                <th>Ngày Sinh</th>
                <th>Lớp</th>
                <th>Điểm</th>
                <th>Email</th>
                <th>Thao Tác</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>

    <!-- Modal -->

    <div id="modal" class="modal">

        <div class="modal-content">

            <h2 id="formTitle">Thêm Sinh Viên</h2>

            <form id="studentForm">

                <input type="text" id="studentId" placeholder="Mã sinh viên" required>

                <input type="text" id="fullName" placeholder="Họ tên" required>

                <input type="date" id="birthday" required>

                <input type="text" id="className" placeholder="Lớp" required>

                <input type="number" id="score" placeholder="Điểm TB" required>

                <input type="email" id="email" placeholder="Email" required>

                <button type="submit" id="submitBtn">
                    Lưu
                </button>

                <button type="button" id="btnClose">
                    Hủy
                </button>

            </form>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
