<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="col-12 col-md-4">
        <div class="card position-relative">
            <span class="badge bg-danger position-absolute">Sale</span>
            <img src="https://picsum.photos/300/200" class="card-img-top" alt="Sản phẩm 1" />
            <div class="card-body"></div>
                <h5 class="card-title">Sản phẩm 1</h5>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#chiTiet">Chi tiết</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="chiTiet">
        <div class="modal-dialog">
            <div class="modal-header">
                <h5 class="modal-title">Chi tiết sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Đây là thông tin chi tiết về sản phẩm</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
